name: Build SQLCipher v4.11.0 (Windows + OpenSSL + Zlib)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 🧹 Limpar diretório anterior com fallback seguro
      - name: 🧽 Limpar diretório antigo
        shell: pwsh
        run: |
          $root = "D:/a/sqlcipher"
          if (Test-Path $root) {
            Write-Host "🧽 Limpando diretório antigo $root..."
            try {
              Remove-Item -Recurse -Force $root -ErrorAction Stop
            } catch {
              Write-Host "⚠️ Remoção direta falhou, tentando com robocopy..."
              New-Item -ItemType Directory -Path "D:/a/empty" -Force | Out-Null
              robocopy "D:/a/empty" $root /MIR | Out-Null
              $LASTEXITCODE = 0  # força sucesso mesmo que robocopy retorne 1
              Remove-Item -Recurse -Force "D:/a/empty" -ErrorAction SilentlyContinue
            }
          }
          Write-Host "✅ Diretório limpo com sucesso."
          exit 0  # garantir saída limpa

      # 🧰 Preparar ambiente MSYS2
      - name: 🧰 Preparar ambiente MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            git
            make
            automake
            libtool
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            zip

      # 📦 Clonar SQLCipher v4.11.0
      - name: 📦 Clonar repositório SQLCipher
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "=== Clonando SQLCipher versão v4.11.0 ==="
          git clone https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher
          git checkout v4.11.0 || git checkout c6e8461bfa0b7317dfd96278dd950b1eb6b21a1a
          echo "✅ SQLCipher v4.11.0 clonado com sucesso."

      # 🔧 Compilar SQLCipher com suporte a OpenSSL e Zlib
      - name: 🔧 Compilar SQLCipher 4.11.0
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "=== Iniciando build SQLCipher v4.11.0 ==="
          cd sqlcipher

          export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
          -DSQLITE_EXTRA_INIT=sqlcipher_extra_init \
          -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown \
          -DSQLITE_TEMP_STORE=2 -I/mingw64/include"

          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz"

          echo "🛠️ Executando autoconf..."
          autoreconf -fi

          echo "⚙️ Executando configure..."
          ./configure --enable-shared --enable-static --disable-tcl

          echo "⚙️ Compilando..."
          make -j$(nproc)

          echo "✅ Build concluído com sucesso!"
          ls -lh . || true

      # 🧩 Montar pacote final com todas as DLLs necessárias
      - name: 🧩 Montar artefato final
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "=== Preparando diretório de saída ==="
          cd sqlcipher
          mkdir -p ../dist

          # Copiar binários principais
          cp sqlite3.exe ../dist/sqlcipher.exe
          cp libsqlite3-0.dll ../dist/libsqlcipher-0.dll
          cp sqlite3.h ../dist/sqlcipher.h || true
          cp sqlite3ext.h ../dist/sqlcipherext.h || true

          # Copiar dependências do OpenSSL e Zlib
          cp /mingw64/bin/libcrypto-3-x64.dll ../dist/ || true
          cp /mingw64/bin/libssl-3-x64.dll ../dist/ || true
          cp /mingw64/bin/zlib1.dll ../dist/ || true

          echo "✅ Todos os arquivos copiados para ../dist"

      # 🧪 Verificar versão do binário gerado
      - name: 🧪 Testar versão compilada
        shell: msys2 {0}
        run: |
          cd sqlcipher/../dist
          ./sqlcipher.exe --version || echo "⚠️ Não foi possível verificar versão."

      # 🗜️ Compactar resultado final
      - name: 🗜️ Compactar build final
        shell: pwsh
        run: |
          $zipPath = "D:/a/sqlcipher/SQLCipher-v4.11.0-win64.zip"
          $distPath = "D:/a/sqlcipher/dist"
          if (-Not (Test-Path $distPath)) {
            Write-Error "❌ Diretório $distPath não encontrado!"
            exit 1
          }
          Compress-Archive -Path "$distPath/*" -DestinationPath $zipPath -Force
          Write-Host "✅ Arquivo compactado com sucesso: $zipPath"

      # 📤 Upload do artefato final
      - name: 📤 Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: SQLCipher-v4.11.0-win64
          path: D:/a/sqlcipher/SQLCipher-v4.11.0-win64.zip
