name: Build SQLCipher (Windows, MSYS2 / MinGW)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-sqlcipher:
    name: Build SQLCipher (msys2/mingw64)
    runs-on: windows-latest
    env:
      TAG: v4.10.0
      MSYSTEM: MINGW64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-tcl
            autoconf
            automake
            pkg-config
            git
            tar
            gzip

      - name: Clone SQLCipher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sqlcipher || true
          git clone --depth 1 --branch "$TAG" https://github.com/sqlcipher/sqlcipher.git sqlcipher
          cd sqlcipher
          echo "cloned: $(git rev-parse --short HEAD)"

      - name: Prepare source tree (generate tsrc)
        shell: bash
        run: |
          set -euo pipefail
          cd sqlcipher
          export PATH="/mingw64/bin:$PATH"
          
          echo "Running autoconf bootstrap..."
          autoreconf -fi
          echo "Running configure to prepare tsrc..."
          ./configure --disable-tcl || true
          
          echo "Generating tsrc directory..."
          make target_source || true
          
          ls -R tsrc || true
          echo "✅ tsrc directory ready"

      - name: Generate amalgamation manually (optional)
        shell: bash
        run: |
          set -euo pipefail
          cd sqlcipher
          export PATH="/mingw64/bin:$PATH"

          if [ -f tsrc/sqlite3.c ]; then
            cp tsrc/sqlite3.c .
            cp tsrc/sqlite3.h .
            cp src/shell.c .
            echo "✅ Copied sqlite3.c, sqlite3.h, shell.c from tsrc/src"
          else
            echo "⚠️ tsrc/sqlite3.c not found — skipping"
          fi

          ls -l sqlite3.c sqlite3.h shell.c || true

      - name: Configure & build SQLCipher
        shell: bash
        run: |
          set -euo pipefail
          cd sqlcipher
          export PATH="/mingw64/bin:$PATH"
          export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_THREADSAFE=1 -DSQLITE_TEMP_STORE=2 -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz"

          ./configure --prefix="$(pwd)/build/install" --enable-shared --enable-static --disable-tcl CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"

          make -j"$(nproc)"
          make install

          mkdir -p ../build-output/bin ../build-output/lib ../build-output/include
          cp -v build/install/bin/* ../build-output/bin/ || true
          cp -v build/install/lib/* ../build-output/lib/ || true
          cp -v build/install/include/* ../build-output/include/ || true

          if [ -f sqlite3.exe ]; then cp -v sqlite3.exe ../build-output/bin/sqlcipher.exe || true; fi
          if [ -f sqlite3.dll ]; then cp -v sqlite3.dll ../build-output/lib/sqlcipher.dll || true; fi

          ls -la ../build-output || true
          ls -la ../build-output/bin || true
          ls -la ../build-output/lib || true

      - name: Verify artifacts
        shell: bash
        run: |
          echo "Artifacts in build-output:"
          ls -la build-output || true
          [ -f build-output/lib/sqlcipher.dll ] || [ -f build-output/lib/libsqlite3.dll ] || { echo "❌ DLL not found"; exit 1; }
          [ -f build-output/bin/sqlcipher.exe ] || [ -f build-output/bin/sqlite3.exe ] || { echo "❌ CLI not found"; exit 1; }
          echo "✅ DLL and EXE generated successfully"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: |
            build-output/lib/*.dll
            build-output/bin/*.exe
            build-output/include/*.h
            build-output/lib/*.a
