name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧰 Set up job
        run: echo "Iniciando build do SQLCipher com OpenSSL para Windows..."

      - name: 📦 Checkout repositório
        uses: actions/checkout@v4

      - name: ⚙️ Instalar dependências (OpenSSL, Tcl, MSYS2)
        shell: pwsh
        run: |
          choco install -y openssl
          choco install -y msys2
          choco install -y tcl
          echo "✅ Dependências instaladas com sucesso."

      - name: 🧩 Configurar ambiente MSYS2
        shell: bash
        run: |
          echo "Configurando MSYS2..."
          export PATH="/c/msys64/usr/bin:/c/msys64/mingw64/bin:$PATH"
          pacman -Sy --noconfirm
          pacman -S --noconfirm make tcl openssl-devel mingw-w64-x86_64-gcc unzip

      - name: 📥 Baixar e extrair SQLCipher
        shell: bash
        run: |
          echo "📦 Baixando SQLCipher v4.5.0..."
          curl -L -o sqlcipher.zip https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.5.0.zip
          unzip -q sqlcipher.zip
          mv sqlcipher-4.5.0 sqlcipher

      - name: 🧱 Gerar arquivos amalgamados via Makefile
        shell: bash
        working-directory: sqlcipher
        run: |
          echo "🔧 Gerando arquivos amalgamados (sqlite3.c e shell.c)..."
          make sqlite3.c

      - name: 🛠️ Compilar SQLCipher com OpenSSL
        shell: bash
        working-directory: sqlcipher
        run: |
          echo "⚙️ Compilando SQLCipher com suporte a OpenSSL..."
          gcc -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
              -I. -I/usr/include -I/usr/include/openssl \
              -O2 -shared -o libsqlcipher.dll sqlite3.c -lcrypto -lpthread -lm
          gcc -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
              -I. -I/usr/include -I/usr/include/openssl \
              -O2 shell.c -o sqlcipher.exe libsqlcipher.dll -lcrypto -lpthread -lm
          echo "✅ Compilação concluída!"

      - name: 📂 Organizar e publicar artefatos
        shell: bash
        run: |
          echo "📦 Procurando binários gerados..."
          mkdir -p build-output

          # Procurar executáveis e DLLs em qualquer subpasta
          find sqlcipher -type f \( -iname "*.exe" -o -iname "*.dll" \) -exec cp {} build-output/ \; || true

          echo "✅ Artefatos encontrados:"
          ls -lh build-output || echo "⚠️ Nenhum artefato encontrado!"

      - name: 📤 Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/

      - name: ✅ Complete job
        run: echo "Build SQLCipher (Windows) concluído com sucesso!"
