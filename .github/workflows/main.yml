name: Build SQLCipher v4.11.0 (Full Package)

on:
  workflow_dispatch:

jobs:
  build-sqlcipher:
    runs-on: windows-latest

    steps:
    - name: 🧰 Preparar ambiente MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          git
          make
          automake
          libtool
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-pkg-config
        msystem: MINGW64

    - name: 🧹 Limpar diretório antigo (forçado)
      shell: pwsh
      run: |
        $root = "D:/a/sqlcipher"
        Write-Host "🧽 Limpando $root..."
        try {
          Stop-Process -Name bash -Force -ErrorAction SilentlyContinue
          Stop-Process -Name make -Force -ErrorAction SilentlyContinue
        } catch {}
        if (Test-Path $root) {
          Write-Host "🧹 Removendo $root (modo forçado)..."
          attrib -r -h -s $root -Recurse -ErrorAction SilentlyContinue
          try {
            Remove-Item -Recurse -Force $root -ErrorAction Stop
          } catch {
            Write-Host "⚠️ Falhou, tentando com robocopy..."
            New-Item -ItemType Directory -Path "D:/a/empty" -Force | Out-Null
            robocopy "D:/a/empty" $root /MIR | Out-Null
            Remove-Item -Recurse -Force "D:/a/empty" -ErrorAction SilentlyContinue
          }
        }
        Write-Host "✅ Diretório limpo com sucesso."

    - name: ⬇️ Clonar SQLCipher v4.11.0
      shell: msys2 {0}
      run: |
        set -euo pipefail
        echo "=== Clonando SQLCipher versão v4.11.0 ==="
        cd /d/a
        git clone https://github.com/sqlcipher/sqlcipher.git
        cd sqlcipher
        git checkout v4.11.0 || git checkout c6e8461bfa0b7317dfd96278dd950b1eb6b21a1a
        echo "✅ SQLCipher v4.11.0 clonado com sucesso."

    - name: ⚙️ Compilar SQLCipher
      shell: msys2 {0}
      run: |
        set -euo pipefail
        echo "=== Compilando SQLCipher v4.11.0 ==="
        cd /d/a/sqlcipher/sqlcipher

        autoreconf -fi

        export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2"
        export LDFLAGS="-lssl -lcrypto -lz"

        ./configure --enable-tempstore=yes --disable-tcl
        make -j$(nproc)
        echo "✅ Compilação concluída com sucesso."
        ls -lh .libs || true

    - name: 📦 Copiar DLLs e criar pacote final
      shell: msys2 {0}
      run: |
        echo "📦 Preparando pacote final..."
        mkdir -p /d/a/sqlcipher/sqlcipher/dist
        cp .libs/sqlcipher.exe /d/a/sqlcipher/sqlcipher/dist/
        cp .libs/libsqlcipher-0.dll /d/a/sqlcipher/sqlcipher/dist/
        cp /mingw64/bin/libssl-3-x64.dll /d/a/sqlcipher/sqlcipher/dist/
        cp /mingw64/bin/libcrypto-3-x64.dll /d/a/sqlcipher/sqlcipher/dist/
        cp /mingw64/bin/zlib1.dll /d/a/sqlcipher/sqlcipher/dist/
        echo "✅ Todos os arquivos copiados para dist/"
        ls -lh /d/a/sqlcipher/sqlcipher/dist

    - name: 💾 Criar artefato ZIP
      shell: pwsh
      run: |
        $zipPath = "sqlcipher-4.11.0-full.zip"
        $distPath = "D:/a/sqlcipher/sqlcipher/sqlcipher/dist"
        if (!(Test-Path $distPath)) {
          throw "❌ Diretório de build não encontrado: $distPath"
        }
        Compress-Archive -Path "$distPath/*" -DestinationPath $zipPath -Force
        Write-Host "✅ Arquivo ZIP criado: $zipPath"

    - name: ⬆️ Enviar artefato
      uses: actions/upload-artifact@v4
      with:
        name: sqlcipher-4.11.0-win64-completo
        path: sqlcipher-4.11.0-full.zip
