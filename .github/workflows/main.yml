name: Build SQLCipher v4.11.0 (Windows + OpenSSL + Zlib)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 🧱 Configurar MSYS2 e dependências
      - name: 🧱 Instalar MSYS2 e pacotes base
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            git
            make
            automake
            libtool
            autoconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            zip

      # 🧹 Limpar qualquer build anterior (fora do MSYS)
      - name: 🧹 Limpar diretório anterior
        shell: pwsh
        run: |
          $base = "D:/a/sqlcipher"
          $repo = "$base/sqlcipher"
          if (Test-Path $repo) {
            Write-Host "🧽 Removendo diretório antigo..."
            try {
              Remove-Item -Recurse -Force $repo -ErrorAction Stop
            } catch {
              Write-Host "⚠️ Remoção direta falhou, tentando com robocopy..."
              New-Item -ItemType Directory -Path "$base/empty" -Force | Out-Null
              robocopy "$base/empty" "$repo" /MIR | Out-Null
              Remove-Item -Recurse -Force "$base/empty" -ErrorAction SilentlyContinue
            }
          }
          Write-Host "✅ Diretório limpo com sucesso."

      # 🧬 Clonar SQLCipher 4.11.0
      - name: 🧬 Clonar SQLCipher v4.11.0
        shell: msys2 {0}
        run: |
          set -e
          cd /d/a
          git clone https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher
          git checkout v4.11.0 || git checkout c6e8461bfa0b7317dfd96278dd950b1eb6b21a1a
          echo "✅ SQLCipher v4.11.0 clonado."

      # 🏗️ Compilar SQLCipher
      - name: 🏗️ Compilar SQLCipher com OpenSSL + zlib
        shell: msys2 {0}
        run: |
          set -e
          cd /d/a/sqlcipher/sqlcipher

          echo "🧰 Gerando configure..."
          autoreconf -fi

          echo "⚙️ Executando configure..."
          ./configure --enable-tempstore=yes \
            CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2" \
            LDFLAGS="-lcrypto -lssl -lz" \
            --disable-tcl

          echo "🧩 Compilando..."
          make -j$(nproc)
          echo "✅ Compilação concluída."

          mkdir -p /d/a/sqlcipher/dist
          cp sqlcipher.exe /d/a/sqlcipher/dist/ 2>/dev/null || cp sqlite3.exe /d/a/sqlcipher/dist/sqlcipher.exe
          cp .libs/libsqlcipher-0.dll /d/a/sqlcipher/dist/ 2>/dev/null || true
          cp sqlcipher.h /d/a/sqlcipher/dist/ || cp sqlite3.h /d/a/sqlcipher/dist/sqlcipher.h
          cp sqlcipherext.h /d/a/sqlcipher/dist/ || cp sqlite3ext.h /d/a/sqlcipher/dist/sqlcipherext.h

          # 🔗 Copiar DLLs essenciais
          cp /mingw64/bin/libcrypto-3-x64.dll /d/a/sqlcipher/dist/ || true
          cp /mingw64/bin/libssl-3-x64.dll /d/a/sqlcipher/dist/ || true
          cp /mingw64/bin/zlib1.dll /d/a/sqlcipher/dist/ || true

          echo "✅ Binários e DLLs prontos:"
          ls -lh /d/a/sqlcipher/dist

      # 🧪 Testar execução
      - name: 🧪 Testar SQLCipher
        shell: msys2 {0}
        run: |
          cd /d/a/sqlcipher/dist
          ./sqlcipher -version || ./sqlcipher --version || echo "⚠️ Falha ao exibir versão"

      # 🗜️ Compactar build final
      - name: 🗜️ Compactar resultado final
        shell: pwsh
        run: |
          $dist = "D:/a/sqlcipher/dist"
          $zip = "D:/a/sqlcipher/sqlcipher-4.11.0-win64.zip"
          if (-Not (Test-Path $dist)) {
            Write-Error "❌ Diretório de saída não encontrado!"
            exit 1
          }
          Compress-Archive -Path "$dist/*" -DestinationPath $zip -Force
          Write-Host "✅ ZIP criado: $zip"

      # 📤 Publicar artefato
      - name: 📤 Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-4.11.0-win64
          path: D:/a/sqlcipher/sqlcipher-4.11.0-win64.zip
