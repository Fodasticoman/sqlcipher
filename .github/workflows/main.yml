# =========================================================
# 🧩 GitHub Actions — Compilação do SQLCipher (Windows)
# =========================================================
# Este workflow:
# 1. Configura o Visual Studio Build Tools (MSVC).
# 2. Instala OpenSSL via Chocolatey.
# 3. Clona e compila o SQLCipher com suporte a criptografia.
# 4. Gera o binário final sqlcipher.exe.
# =========================================================

name: Build SQLCipher Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 🔧 Compilar SQLCipher (Windows)
    runs-on: windows-latest

    steps:
      # -----------------------------
      # 1️⃣ Checkout
      # -----------------------------
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # -----------------------------
      # 2️⃣ Instalar OpenSSL
      # -----------------------------
      - name: Instalar OpenSSL
        run: |
          choco install openssl.light -y
          echo "✅ OpenSSL instalado em C:\Program Files\OpenSSL"

      # -----------------------------
      # 3️⃣ Clonar SQLCipher
      # -----------------------------
      - name: Clonar SQLCipher
        run: |
          git clone --depth 1 https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher
          git log -1 --oneline

      # -----------------------------
      # 4️⃣ Compilar com MSVC
      # -----------------------------
      - name: Compilar SQLCipher com MSVC
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          cd sqlcipher
          echo Compilando SQLCipher com suporte a OpenSSL...

          set OPENSSL_PATH=C:\Program Files\OpenSSL

          cl /O2 /DSQLITE_HAS_CODEC /DSQLCIPHER_CRYPTO_OPENSSL /DSQLITE_TEMP_STORE=2 ^
             /I. /I"src" /I"%OPENSSL_PATH%\include" src\shell.c src\sqlite3.c ^
             /link /LIBPATH:"%OPENSSL_PATH%\lib" libcrypto.lib libssl.lib ^
             /OUT:sqlcipher.exe

      # -----------------------------
      # 5️⃣ Exibir resultado
      # -----------------------------
      - name: Listar binário final
        run: dir sqlcipher

      # -----------------------------
      # 6️⃣ Publicar artefato
      # -----------------------------
      - name: Upload do binário SQLCipher
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: sqlcipher/sqlcipher.exe
