name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar dependências essenciais
        run: |
          Write-Host "🔧 Instalando OpenSSL, Tcl e 7-Zip..."
          winget install -e --id ShiningLight.OpenSSL.Light --accept-source-agreements --accept-package-agreements
          winget install -e --id ActiveState.ActiveTcl --accept-source-agreements --accept-package-agreements
          choco install 7zip -y
          Write-Host "✅ Dependências instaladas com sucesso."

      - name: Configurar ambiente MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            pkg-config
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            tcl

      - name: Baixar e extrair SQLCipher
        shell: bash
        run: |
          set -euo pipefail
          TAG="v4.5.5"
          echo "📦 Baixando SQLCipher versão $TAG..."
          curl -L --retry 5 --retry-delay 3 --fail \
            "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/${TAG}.tar.gz" \
            -o sqlcipher.tar.gz

          echo "📦 Extraindo com 7-Zip..."
          mkdir extract && cd extract
          7z x ../sqlcipher.tar.gz -y >/dev/null
          7z x sqlcipher.tar -y >/dev/null
          rm sqlcipher.tar
          EXTRACTED_DIR=$(ls -d sqlcipher-* | head -n 1)
          mv "$EXTRACTED_DIR" ../sqlcipher
          cd ..
          echo "✅ SQLCipher $TAG pronto para compilação."

      - name: Gerar arquivos amalgamados com Tcl
        shell: bash
        run: |
          set -euo pipefail
          echo "🔧 Gerando sqlite3.c e shell.c via Tcl..."
          cd sqlcipher

          if ! command -v tclsh &>/dev/null; then
            echo "❌ Tcl não encontrado!"; exit 1;
          fi

          mkdir -p tsrc
          cp -r src/* tsrc/
          cp tool/mksqlite3c.tcl .
          cp tool/mkshellc.tcl .

          echo "🧩 Executando mksqlite3c.tcl..."
          tclsh mksqlite3c.tcl > sqlite3.c

          echo "🧩 Executando mkshellc.tcl..."
          tclsh mkshellc.tcl > shell.c

          ls -lh sqlite3.c shell.c

          echo "✅ Arquivos amalgamados gerados com sucesso."

      - name: Compilar SQLCipher com OpenSSL
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd sqlcipher

          echo "⚙️ Compilando libsqlcipher.dll..."
          gcc -O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
            -I. -shared -o libsqlcipher.dll sqlite3.c \
            -lcrypto -lssl -lz

          echo "⚙️ Compilando shell (CLI)..."
          gcc -O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
            -I. -o sqlcipher.exe shell.c sqlite3.c \
            -lcrypto -lssl -lz

          echo "✅ Compilação concluída com sucesso."
          ls -lh sqlcipher.exe libsqlcipher.dll

      - name: Organizar artefatos
        shell: bash
        run: |
          mkdir -p build-output
          cp sqlcipher/sqlcipher.exe build-output/sqlcipher.exe || true
          cp sqlcipher/libsqlcipher.dll build-output/libsqlcipher.dll || true
          echo "✅ Artefatos copiados:"
          ls -lh build-output

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/
