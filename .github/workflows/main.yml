name: Build SQLCipher (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 🔧 Compilar SQLCipher com MSVC + OpenSSL
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Instalar Build Tools + OpenSSL
      - name: Instalar dependências (Visual C++ + OpenSSL)
        run: |
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --quiet --norestart" -y
          choco install openssl.light -y
        shell: powershell

      # 3️⃣ Configurar ambiente MSVC
      - name: Configurar ambiente do compilador MSVC
        run: |
          echo "Inicializando ambiente de compilação MSVC..."
          if (Test-Path "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat") {
            echo "✅ vcvars64 encontrado."
          } else {
            echo "❌ vcvars64.bat não encontrado!"; exit 1
          }

      # 4️⃣ Clonar SQLCipher
      - name: Clonar SQLCipher
        run: |
          git clone --depth 1 https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher
          git log -1 --oneline

      # 5️⃣ Compilar SQLCipher com suporte a OpenSSL
      - name: Compilar SQLCipher
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          cd sqlcipher
          echo Compilando SQLCipher com suporte a OpenSSL...

          set OPENSSL_PATH=C:\Program Files\OpenSSL

          cl /O2 /DSQLITE_HAS_CODEC /DSQLCIPHER_CRYPTO_OPENSSL /DSQLITE_TEMP_STORE=2 ^
             /I. /I"src" /I"%OPENSSL_PATH%\include" src\shell.c src\sqlite3.c ^
             /link /LIBPATH:"%OPENSSL_PATH%\lib" libcrypto.lib libssl.lib ^
             /OUT:sqlcipher.exe

      # 6️⃣ Publicar artefato
      - name: Upload do binário gerado
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: sqlcipher/sqlcipher.exe
