name: Build SQLCipher (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🔽 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🧰 Instalar MSYS2 e dependências
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            pkg-config
            p7zip

      - name: ⚙️ Compilar SQLCipher (Windows x64)
        shell: msys2 {0}
        run: |
          set -euo pipefail

          echo "📁 Criando diretórios..."
          mkdir -p build_sqlcipher
          cd build_sqlcipher

          echo "⬇️ Clonando SQLCipher..."
          git clone https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher

          echo "🔍 Verificando arquivos..."
          ls -la | grep configure || echo "⚠️ Script configure será usado diretamente"

          echo "⚙️ Configurando build..."
          export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2 -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz"

          ./configure --enable-shared --enable-static --disable-tcl
          echo "🧩 Compilando..."
          make -j$(nproc)

          echo "✅ Build concluído com sucesso."
          mkdir -p ../../output

          echo "📦 Copiando artefatos..."
          cp .libs/libsqlcipher-0.dll ../../output/ || true
          cp .libs/libsqlcipher.a ../../output/ || true
          cp sqlcipher.exe ../../output/ || true
          cp sqlite3.h ../../output/sqlite.h || true
          cp /mingw64/bin/libssl-3-x64.dll ../../output/ || true
          cp /mingw64/bin/libcrypto-3-x64.dll ../../output/ || true
          cp /mingw64/bin/zlib1.dll ../../output/ || true

          echo "🗜️ Compactando..."
          cd ../../
          7z a sqlcipher-win64.zip ./output/*

      - name: 📤 Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-win64
          path: sqlcipher-win64.zip
