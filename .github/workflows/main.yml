name: Build SQLCipher (Windows, MSYS2/MingW64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'SQLCipher tag (ex: v4.10.0)'
        required: true
        default: 'v4.10.0'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSYS2 (install required packages)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkg-config

      - name: Build SQLCipher (MSYS2 shell)
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail

          echo "🔹 Tag: $TAG"
          # Clean old checkout (safety)
          rm -rf sqlcipher || true

          echo "🔹 Clonando SQLCipher..."
          git clone --depth 1 --branch "$TAG" https://github.com/sqlcipher/sqlcipher.git sqlcipher
          cd sqlcipher

          echo "=> Current commit:"
          git rev-parse --short HEAD || true
          echo "=> Listing top-level files:"
          ls -la

          echo "🔹 Preparando flags de compilação..."
          export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_THREADSAFE=1 -DSQLITE_TEMP_STORE=2 -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -DHAVE_STDINT_H -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz"

          echo "CFLAGS: $CFLAGS"
          echo "LDFLAGS: $LDFLAGS"

          echo "🔹 Rodando ./configure (gera Makefile)..."
          # Execute configure with environment CFLAGS/LDFLAGS set above.
          if ! ./configure --prefix="$(pwd)/build/install" --enable-shared --enable-static --disable-tcl ; then
            echo "⚠️ configure falhou. Mostrando head de config.log para diagnóstico:"
            [ -f config.log ] && sed -n '1,200p' config.log || true
            exit 1
          fi

          echo "🔹 Running make..."
          make -j"$(nproc)" || { echo "❌ make falhou"; exit 1; }

          echo "🔹 Running make install..."
          make install || { echo "❌ make install falhou"; exit 1; }

          echo "🔹 Artefatos (install):"
          ls -la build/install || true

          # Copy a CLI binary to build-output for upload.
          mkdir -p ../build-output
          # The CLI may be named sqlite3 or sqlcipher depending on build; try both.
          if [ -f "./sqlite3.exe" ]; then
            cp ./sqlite3.exe ../build-output/sqlcipher.exe
          elif [ -f "./sqlcipher.exe" ]; then
            cp ./sqlcipher.exe ../build-output/sqlcipher.exe
          elif [ -f "build/install/bin/sqlite3.exe" ]; then
            cp build/install/bin/sqlite3.exe ../build-output/sqlcipher.exe
          elif [ -f "build/install/bin/sqlcipher.exe" ]; then
            cp build/install/bin/sqlcipher.exe ../build-output/sqlcipher.exe
          else
            echo "⚠️ Nenhum binário CLI padrão encontrado — listando diretórios para depuração:"
            ls -la || true
            exit 1
          fi

          echo "✅ Build finalizado. Saída em ../build-output/sqlcipher.exe"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/sqlcipher.exe
