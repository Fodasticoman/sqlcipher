name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:   # permite rodar manualmente
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Chocolatey
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host "Instalando Chocolatey..."
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          } else {
            Write-Host "Chocolatey já instalado."
          }
        shell: powershell

      - name: Instalar Visual Studio Build Tools
        run: |
          Write-Host "Instalando Visual Studio Build Tools..."
          choco install visualstudio2022buildtools --params '--add Microsoft.VisualStudio.Workload.VCTools --quiet --norestart' -y
        shell: powershell

      - name: Instalar OpenSSL (via winget)
        run: |
          Write-Host "Instalando OpenSSL via winget..."
          winget install -e --id ShiningLight.OpenSSL.Light --accept-source-agreements --accept-package-agreements
        shell: powershell

      - name: Baixar SQLCipher
        run: |
          Write-Host "Baixando SQLCipher v4.10.0..."
          Invoke-WebRequest -Uri "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.10.0.zip" -OutFile "sqlcipher.zip"
          Expand-Archive sqlcipher.zip -DestinationPath .
          Rename-Item "sqlcipher-4.10.0" "sqlcipher"
          Write-Host "SQLCipher extraído com sucesso."
        shell: powershell

      - name: Compilar SQLCipher (com ambiente VS configurado)
        shell: powershell
        run: |
          Write-Host "Configurando ambiente do compilador..."

          $vcvarsPath = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          if (-Not (Test-Path $vcvarsPath)) {
            Write-Error "vcvars64.bat não encontrado em: $vcvarsPath"
            exit 1
          }

          $opensslPath = "C:\Program Files\OpenSSL-Win64"
          if (-Not (Test-Path $opensslPath)) {
            Write-Error "OpenSSL não encontrado em: $opensslPath"
            exit 1
          }

          Write-Host "Compilando SQLCipher com suporte a OpenSSL..."
          $sqlcipherDir = "$(Get-Location)\sqlcipher"

          # Invocar o vcvars64.bat e compilar dentro do mesmo processo
          cmd /c "`"$vcvarsPath`" && cd /d `"$sqlcipherDir`" && cl /O2 /DSQLITE_HAS_CODEC /DSQLCIPHER_CRYPTO_OPENSSL /DSQLITE_TEMP_STORE=2 /I. /I`"src`" /I`"$opensslPath\include`" src\shell.c src\sqlite3.c /link /LIBPATH:`"$opensslPath\lib`" libcrypto.lib libssl.lib /OUT:sqlcipher.exe"

      - name: Verificar build
        shell: powershell
        run: |
          if (Test-Path "sqlcipher\sqlcipher.exe") {
            Write-Host "✅ Build concluído com sucesso!"
          } else {
            Write-Error "❌ Falha na compilação: sqlcipher.exe não encontrado."
            exit 1
          }

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: sqlcipher/sqlcipher.exe
