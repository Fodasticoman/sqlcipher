name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:   # botão "Run workflow"
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar OpenSSL via winget
        run: |
          Write-Host "Instalando OpenSSL..."
          winget install -e --id ShiningLight.OpenSSL.Light --accept-source-agreements --accept-package-agreements
        shell: powershell

      - name: Baixar SQLCipher
        run: |
          $tag = "v4.10.0"
          Write-Host "Baixando SQLCipher $tag..."
          Invoke-WebRequest -Uri "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/$tag.zip" -OutFile "sqlcipher.zip"
          Expand-Archive sqlcipher.zip -DestinationPath .
          Rename-Item "sqlcipher-$($tag.TrimStart('v'))" "sqlcipher"
          Write-Host "✅ SQLCipher extraído com sucesso."
        shell: powershell

      - name: Compilar SQLCipher (usando Makefile.msc)
        shell: cmd
        run: |
          echo Configurando ambiente de compilação...
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          cd sqlcipher
          echo Compilando com NMake e suporte a OpenSSL...

          set OPENSSL_PATH=C:\Program Files\OpenSSL-Win64
          if not exist "%OPENSSL_PATH%" (
            echo ERRO: OpenSSL não encontrado!
            exit /b 1
          )

          nmake /f Makefile.msc USE_OPENSSL=1 OPENSSL_PATH="%OPENSSL_PATH%" SQLITE_HAS_CODEC=1 OPTIMIZATIONS=2

      - name: Verificar resultado
        shell: powershell
        run: |
          if (Test-Path "sqlcipher\sqlite3.exe") {
            Write-Host "✅ Build concluído com sucesso!"
          } else {
            Write-Error "❌ Falha na compilação: sqlite3.exe não encontrado."
            exit 1
          }

      - name: Publicar artefato compilado
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: sqlcipher/sqlite3.exe
