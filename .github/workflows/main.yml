# =========================================================
# 🧩 GitHub Actions — Compilação do SQLCipher (Windows)
# =========================================================
# Este workflow:
# 1. É executado manualmente ou quando há push no branch main.
# 2. Clona o repositório oficial do SQLCipher.
# 3. Compila usando o Microsoft Visual C++ (MSVC) com suporte a OpenSSL.
# 4. Gera o binário final `sqlcipher.exe`.
# 5. Faz upload automático como artefato.
# =========================================================

name: Build SQLCipher Windows

on:
  push:
    branches: [ main ]  # Executa ao enviar para a branch principal
  workflow_dispatch:      # Permite execução manual pelo GitHub

jobs:
  build:
    name: 🔧 Compilar SQLCipher (Windows)
    runs-on: windows-latest   # Usa Windows Server com MSVC pré-instalado

    steps:
      # -----------------------------
      # 1️⃣ Baixar o código do repositório
      # -----------------------------
      - name: Checkout do projeto
        uses: actions/checkout@v4

      # -----------------------------
      # 2️⃣ Configurar compilador MSVC
      # -----------------------------
      - name: Configurar ambiente MSVC
        uses: microsoft/setup-msbuild@v2

      # -----------------------------
      # 3️⃣ Instalar dependências (OpenSSL + zlib)
      # -----------------------------
      - name: Instalar OpenSSL e zlib
        run: |
          choco install openssl.light -y
          choco install zlib -y

      # -----------------------------
      # 4️⃣ Clonar o repositório SQLCipher
      # -----------------------------
      - name: Clonar SQLCipher
        run: |
          git clone --depth 1 https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher
          git log -1 --oneline

      # -----------------------------
      # 5️⃣ Compilar SQLCipher com MSVC
      # -----------------------------
      - name: Compilar SQLCipher (MSVC)
        shell: cmd
        run: |
          cd sqlcipher
          echo Compilando SQLCipher com suporte a OpenSSL...

          rem Caminhos padrão do OpenSSL (instalado via Chocolatey)
          set OPENSSL_PATH="C:\Program Files\OpenSSL-Win64"

          rem Compilação com criptografia e threads habilitados
          cl /O2 /DSQLITE_HAS_CODEC /DSQLCIPHER_CRYPTO_OPENSSL /DSQLITE_TEMP_STORE=2 ^
             /I. /I"src" /I%OPENSSL_PATH%\include src\shell.c src\sqlite3.c ^
             /link /LIBPATH:%OPENSSL_PATH%\lib libcrypto.lib libssl.lib zlib.lib ^
             /OUT:sqlcipher.exe

      # -----------------------------
      # 6️⃣ Verificar se o binário foi gerado
      # -----------------------------
      - name: Listar arquivos de saída
        run: |
          dir sqlcipher

      # -----------------------------
      # 7️⃣ Publicar artefato (binário final)
      # -----------------------------
      - name: Upload do binário SQLCipher
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: sqlcipher/sqlcipher.exe

      # -----------------------------
      # ✅ Fim do workflow
      # -----------------------------
