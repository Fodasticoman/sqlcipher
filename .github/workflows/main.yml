name: Build SQLCipher (Windows, MSYS2 / MinGW)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-sqlcipher:
    name: Build SQLCipher (msys2/mingw64)
    runs-on: windows-latest
    env:
      TAG: v4.10.0
      MSYSTEM: MINGW64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (install pacman + update)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-tcl
            autoconf
            automake
            pkg-config
            git
            tar
            gzip

      - name: Show environment (debug)
        shell: bash
        run: |
          echo "MSYSTEM=$MSYSTEM"
          which gcc || true
          gcc --version || true
          pacman -Qi mingw-w64-x86_64-openssl || true

      - name: Clone SQLCipher (shallow)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sqlcipher || true
          git clone --depth 1 --branch "$TAG" https://github.com/sqlcipher/sqlcipher.git sqlcipher
          cd sqlcipher
          echo "cloned: $(git rev-parse --short HEAD)"

      - name: Generate amalgamation (sqlite3.c and shell.c)
        shell: bash
        run: |
          set -euo pipefail
          cd sqlcipher
          export PATH="/mingw64/bin:$PATH"

          if [ -f sqlite3.c ] && [ -f shell.c ]; then
            echo "amalgamation files already present"
          else
            echo "Generating sqlite3.c and shell.c with tclsh..."
            /mingw64/bin/tclsh tool/mksqlite3c.tcl --linemacros=0 > sqlite3.c
            /mingw64/bin/tclsh tool/mkshellc.tcl > shell.c || true
            if [ ! -f sqlite3.c ] && [ -f tsrc/sqlite3.c ]; then
              cp tsrc/sqlite3.c sqlite3.c
            fi
            if [ ! -f shell.c ] && [ -f src/shell.c ]; then
              cp src/shell.c shell.c
            fi
          fi

          ls -l sqlite3.c shell.c || true

      - name: Configure & build SQLCipher
        shell: bash
        run: |
          set -euo pipefail
          cd sqlcipher

          export PATH="/mingw64/bin:$PATH"
          export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_THREADSAFE=1 -DSQLITE_TEMP_STORE=2 -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz"

          ./configure --prefix="$(pwd)/build/install" --enable-shared --enable-static --disable-tcl CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"

          make -j"$(nproc)"
          make install

          mkdir -p ../build-output/bin ../build-output/lib ../build-output/include
          cp -v build/install/bin/* ../build-output/bin/ || true
          cp -v build/install/lib/* ../build-output/lib/ || true
          cp -v build/install/include/* ../build-output/include/ || true

          if [ -f sqlite3.exe ]; then cp -v sqlite3.exe ../build-output/bin/sqlcipher.exe || true; fi
          if [ -f sqlite3.dll ]; then cp -v sqlite3.dll ../build-output/lib/sqlcipher.dll || true; fi

          ls -la ../build-output || true
          ls -la ../build-output/bin || true
          ls -la ../build-output/lib || true

      - name: Verify presence of DLL and EXE
        shell: bash
        run: |
          set -euo pipefail
          echo "Artifacts in build-output:"
          ls -la build-output || true
          if [ -f build-output/lib/sqlcipher.dll ]; then
            echo "✅ sqlcipher.dll found"
          elif [ -f build-output/lib/libsqlite3.dll ]; then
            echo "✅ dll found (libsqlite3.dll)"
          else
            echo "❌ No DLL found in build-output/lib"
            ls -la build-output/lib || true
            exit 1
          fi

          if [ -f build-output/bin/sqlcipher.exe ] || [ -f build-output/bin/sqlite3.exe ]; then
            echo "✅ CLI found"
          else
            echo "❌ No CLI exe found"
            ls -la build-output/bin || true
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: |
            build-output/lib/*.dll
            build-output/bin/*.exe
            build-output/include/*.h
            build-output/lib/*.a
