name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🚀 Iniciar
        run: echo "Iniciando build SQLCipher (OpenSSL + MSYS2 no Windows)..."

      - name: 📦 Checkout repositório
        uses: actions/checkout@v4

      - name: ⚙️ Instalar MSYS2 e dependências
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            autoconf
            automake
            libtool
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkg-config
            tar
            curl
            unzip

      - name: 📥 Baixar e extrair SQLCipher
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TAG="v4.5.5"
          echo "📦 Baixando SQLCipher versão $TAG..."
          curl -L -o sqlcipher.tar.gz "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/${TAG}.tar.gz"

          echo "📂 Extraindo com proteção contra SIGPIPE..."
          mkdir -p sqlcipher-src
          tar -xzf sqlcipher.tar.gz -C sqlcipher-src --strip-components=1 || true

          if [ ! -d "sqlcipher-src" ] || [ -z "$(ls -A sqlcipher-src)" ]; then
            echo "❌ Falha na extração. Tentando método alternativo..."
            7z x sqlcipher.tar.gz -osqlcipher-src > /dev/null
          fi

          echo "✅ Extração concluída."
          mv sqlcipher-src sqlcipher

      - name: 🧱 Configurar build (OpenSSL)
        shell: msys2 {0}
        working-directory: sqlcipher
        run: |
          echo "🛠️ Executando autoconf..."
          ./configure \
            --enable-tempstore=yes \
            --with-crypto-lib=openssl \
            CFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL" \
            LDFLAGS="-lcrypto -lssl"
          echo "✅ Configuração concluída."

      - name: ⚙️ Compilar SQLCipher
        shell: msys2 {0}
        working-directory: sqlcipher
        run: |
          echo "🔧 Compilando..."
          make -j$(nproc)
          echo "✅ Compilação finalizada."

      - name: 📂 Organizar artefatos
        shell: msys2 {0}
        run: |
          mkdir -p build-output
          find sqlcipher -type f \( -iname "*.exe" -o -iname "*.dll" -o -iname "sqlcipher" \) -exec cp {} build-output/ \;
          echo "📦 Artefatos:"
          ls -lh build-output || echo "⚠️ Nenhum artefato encontrado!"

      - name: 📤 Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/

      - name: ✅ Finalizar
        run: echo "🏁 Build completo! Artefatos disponíveis em 'Artifacts'."
