name: Build SQLCipher v4.11.0 for Windows (x64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 🧰 Instalar MSYS2 e dependências
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          git
          make
          zip
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-zlib

    - name: 🧹 Preparar ambiente limpo
      shell: pwsh
      run: |
        $root = "${{ github.workspace }}"
        $build = "$root\\build_sqlcipher"
        $out = "$root\\out"
        $empty = "$root\\empty"

        Write-Host "🧽 Limpando ambiente..."
        foreach ($d in @($build, $out, $empty)) {
          if (Test-Path $d) {
            try {
              Remove-Item -Recurse -Force $d -ErrorAction Stop
            } catch {
              Write-Host "⚠️ Falha ao remover $d, tentando robocopy..."
              New-Item -ItemType Directory -Path $empty -Force | Out-Null
              & robocopy $empty $d /MIR | Out-Null
              Remove-Item -Recurse -Force $empty -ErrorAction SilentlyContinue
            }
          }
        }

        New-Item -ItemType Directory -Force -Path $build | Out-Null
        New-Item -ItemType Directory -Force -Path $out | Out-Null
        Write-Host "✅ Diretórios prontos."

    - name: ⬇️ Clonar SQLCipher
      shell: msys2 {0}
      run: |
        set -euo pipefail
        cd "${{ github.workspace }}/build_sqlcipher"
        echo "=== Clonando SQLCipher ==="
        git clone https://github.com/sqlcipher/sqlcipher.git
        cd sqlcipher
        git checkout v4.11.0 || git checkout c6e8461bfa0b7317dfd96278dd950b1eb6b21a1a
        echo "✅ Clone OK"

    - name: ⚙️ Configurar e compilar SQLCipher
      shell: msys2 {0}
      run: |
        set -euo pipefail
        cd "${{ github.workspace }}/build_sqlcipher/sqlcipher"

        echo "⚙️ Configurando build..."
        export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2 -I/mingw64/include"
        export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz"

        ./configure --enable-shared --enable-static --disable-tcl
        echo "🧩 Compilando..."
        make -j$(nproc)
        echo "✅ Build concluído."

        strip sqlcipher.exe || true
        strip .libs/libsqlcipher-0.dll || true

    - name: 📦 Copiar binários
      shell: pwsh
      run: |
        $root = "${{ github.workspace }}"
        $src = "$root\\build_sqlcipher\\sqlcipher"
        $out = "$root\\out"

        Write-Host "📦 Copiando binários..."
        Copy-Item "$src\\sqlcipher.exe" $out -ErrorAction SilentlyContinue
        Copy-Item "$src\\.libs\\libsqlcipher-0.dll" $out -ErrorAction SilentlyContinue
        Copy-Item "C:\\msys64\\mingw64\\bin\\libcrypto-3-x64.dll" $out -ErrorAction SilentlyContinue
        Copy-Item "C:\\msys64\\mingw64\\bin\\libssl-3-x64.dll" $out -ErrorAction SilentlyContinue
        Copy-Item "C:\\msys64\\mingw64\\bin\\zlib1.dll" $out -ErrorAction SilentlyContinue

        Write-Host "✅ Conteúdo final:"
        Get-ChildItem $out

    - name: 🗜️ Compactar artefato final
      shell: pwsh
      run: |
        $root = "${{ github.workspace }}"
        $zipPath = "$root\\sqlcipher-win64.zip"
        $out = "$root\\out"

        Write-Host "🗜️ Compactando artefatos..."
        Compress-Archive -Path "$out\\*" -DestinationPath $zipPath -Force
        if (Test-Path $zipPath) {
          Write-Host "✅ ZIP criado em: $zipPath"
        } else {
          Write-Host "❌ Falha: arquivo ZIP não foi gerado!"
          exit 1
        }

    - name: 🚀 Upload do artefato
      uses: actions/upload-artifact@v4
      with:
        name: sqlcipher-win64
        path: ${{ github.workspace }}/sqlcipher-win64.zip
