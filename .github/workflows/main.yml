name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧰 Iniciar job
        run: echo "🚀 Iniciando build do SQLCipher (OpenSSL + MSYS2 no Windows)..."

      - name: 📦 Checkout repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar ambiente MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            autoconf
            automake
            libtool
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkg-config
            tar
            curl

      - name: 📥 Baixar e extrair SQLCipher
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TAG="v4.5.5"
          echo "📦 Baixando SQLCipher versão $TAG..."
          curl -L -o sqlcipher.tar.gz "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/${TAG}.tar.gz"
          tar -xzf sqlcipher.tar.gz
          mv sqlcipher-* sqlcipher
          echo "✅ Extração concluída."

      - name: 🧱 Configurar build (OpenSSL)
        shell: msys2 {0}
        working-directory: sqlcipher
        run: |
          echo "🛠️ Executando autoconf..."
          ./configure \
            --enable-tempstore=yes \
            --with-crypto-lib=openssl \
            CFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL" \
            LDFLAGS="-lcrypto -lssl"
          echo "✅ Configuração finalizada."

      - name: ⚙️ Compilar SQLCipher
        shell: msys2 {0}
        working-directory: sqlcipher
        run: |
          echo "🔧 Compilando SQLCipher..."
          make -j$(nproc)
          echo "✅ Compilação concluída com sucesso."

      - name: 📂 Organizar artefatos
        shell: msys2 {0}
        run: |
          mkdir -p build-output
          find sqlcipher -type f \( -iname "*.exe" -o -iname "*.dll" -o -iname "sqlcipher" \) -exec cp {} build-output/ \;
          ls -lh build-output

      - name: 📤 Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/

      - name: ✅ Finalizar
        run: echo "🏁 Build completo! Executável e DLL disponíveis em 'Artifacts'."
