name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            m4
            make
            pkg-config
            tcl
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-tcl

      - name: Baixar e extrair SQLCipher
        shell: bash
        run: |
          set -euo pipefail
          TAG="v4.5.5"
          echo "📦 Baixando SQLCipher versão $TAG..."

          curl -L --retry 5 --retry-delay 3 --fail \
            "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/${TAG}.tar.gz" \
            -o sqlcipher.tar.gz

          echo "📦 Extraindo com 7-Zip (modo seguro)..."
          mkdir extract
          cd extract
          7z x ../sqlcipher.tar.gz -y >/dev/null
          7z x sqlcipher.tar -y >/dev/null
          rm sqlcipher.tar

          EXTRACTED_DIR=$(ls -d sqlcipher-* | head -n 1)
          if [ ! -d "$EXTRACTED_DIR" ]; then
            echo "❌ Erro: diretório não encontrado após extração!"
            ls -l
            exit 1
          fi

          echo "📂 Pasta extraída: $EXTRACTED_DIR"
          mv "$EXTRACTED_DIR" ../sqlcipher
          cd ..
          echo "✅ SQLCipher $TAG pronto para compilação."

      - name: Gerar arquivos amalgamados com Tcl
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd sqlcipher
          echo "🔧 Gerando sqlite3.c e shell.c..."
          if [ ! -f sqlite3.c ]; then
            /usr/bin/tclsh tool/mksqlite3c.tcl --linemacros=0 > sqlite3.c
          fi
          if [ ! -f shell.c ]; then
            /usr/bin/tclsh tool/mkshellc.tcl > shell.c
          fi
          echo "✅ Arquivos amalgamados gerados:"
          ls -lh sqlite3.c shell.c

      - name: Compilar SQLCipher com OpenSSL
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd sqlcipher

          echo "🔧 Executando autoreconf..."
          autoreconf -fi

          echo "⚙️ Executando ./configure..."
          ./configure \
            --enable-tempstore=yes \
            --enable-fts5 \
            --enable-json1 \
            --disable-tcl \
            --with-crypto-lib=openssl \
            CFLAGS="-O2 -DSQLITE_HAS_CODEC" \
            LDFLAGS="-lcrypto -lssl"

          echo "🧱 Compilando..."
          make -j$(nproc)

          echo "✅ Compilação concluída."
          ls -lh .libs/ || true
          ls -lh *.dll *.exe || true

      - name: Organizar artefatos
        shell: bash
        run: |
          mkdir -p build-output
          cp sqlcipher/.libs/libsqlcipher*.dll build-output/sqlcipher.dll || true
          cp sqlcipher/sqlite3.exe build-output/sqlcipher.exe || true
          echo "✅ Artefatos copiados:"
          ls -lh build-output

      - name: Compactar e publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/
