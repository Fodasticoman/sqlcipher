name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧰 Iniciar job
        run: echo "🚀 Iniciando build do SQLCipher com OpenSSL no Windows..."

      - name: 📦 Checkout repositório
        uses: actions/checkout@v4

      - name: ⚙️ Instalar dependências básicas (OpenSSL, MSYS2)
        shell: pwsh
        run: |
          choco install -y openssl
          choco install -y msys2
          echo "✅ Dependências básicas instaladas."

      - name: 🧩 Configurar ambiente MSYS2 e instalar pacotes nativos
        shell: bash
        run: |
          echo "🔧 Atualizando e configurando MSYS2..."
          export PATH="/c/msys64/usr/bin:/c/msys64/mingw64/bin:$PATH"
          pacman -Sy --noconfirm
          pacman -S --noconfirm make gcc unzip \
              tcl tcl-devel openssl-devel mingw-w64-x86_64-gcc
          echo "✅ MSYS2 e dependências instaladas."

      - name: 📥 Baixar e extrair SQLCipher
        shell: bash
        run: |
          echo "📦 Baixando SQLCipher v4.5.0..."
          curl -L -o sqlcipher.zip https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.5.0.zip
          unzip -q sqlcipher.zip
          mv sqlcipher-4.5.0 sqlcipher

      - name: 🧱 Gerar arquivos amalgamados via Makefile
        shell: bash
        working-directory: sqlcipher
        run: |
          echo "🧩 Gerando arquivos amalgamados (sqlite3.c e shell.c)..."
          make sqlite3.c

      - name: 🛠️ Compilar SQLCipher com suporte a OpenSSL
        shell: bash
        working-directory: sqlcipher
        run: |
          echo "⚙️ Compilando SQLCipher..."
          gcc -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
              -I. -I/usr/include -I/usr/include/openssl \
              -O2 -shared -o libsqlcipher.dll sqlite3.c -lcrypto -lpthread -lm

          gcc -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
              -I. -I/usr/include -I/usr/include/openssl \
              -O2 shell.c -o sqlcipher.exe libsqlcipher.dll -lcrypto -lpthread -lm

          echo "✅ Compilação concluída com sucesso."

      - name: 📂 Organizar artefatos
        shell: bash
        run: |
          echo "📦 Organizando binários..."
          mkdir -p build-output
          find sqlcipher -type f \( -iname "*.exe" -o -iname "*.dll" \) -exec cp {} build-output/ \;
          ls -lh build-output

      - name: 📤 Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/

      - name: ✅ Finalizar job
        run: echo "🏁 Build finalizado com sucesso. Artefatos publicados!"
