name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar OpenSSL via winget
        run: |
          Write-Host "Instalando OpenSSL..."
          winget install -e --id ShiningLight.OpenSSL.Light --accept-source-agreements --accept-package-agreements
          Write-Host "OpenSSL instalado com sucesso."
        shell: powershell

      - name: Baixar SQLCipher
        run: |
          $tag = "v4.10.0"
          Write-Host "Baixando SQLCipher $tag..."
          Invoke-WebRequest -Uri "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/$tag.zip" -OutFile "sqlcipher.zip"
          Expand-Archive sqlcipher.zip -DestinationPath .
          Rename-Item "sqlcipher-$($tag.TrimStart('v'))" "sqlcipher"
          Write-Host "SQLCipher extraído com sucesso."
        shell: powershell

      - name: Compilar SQLCipher (DLL e EXE)
        shell: cmd
        run: |
          echo ===========================================
          echo Configurando ambiente de compilacao...
          echo ===========================================
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          cd sqlcipher
          echo ===========================================
          echo Compilando SQLCipher com suporte a OpenSSL...
          echo ===========================================

          set "OPENSSL_PATH=C:\Program Files\OpenSSL-Win64"
          if not exist "%OPENSSL_PATH%" (
            echo ERRO: OpenSSL nao encontrado em "%OPENSSL_PATH%"
            exit /b 1
          )

          rem === Compila a biblioteca dinâmica (DLL) ===
          echo Compilando biblioteca dinamica (sqlcipher.dll)...
          cl /O2 /LD /DSQLITE_HAS_CODEC /DSQLCIPHER_CRYPTO_OPENSSL /DSQLITE_TEMP_STORE=2 ^
             /I. /I"%OPENSSL_PATH%\include" sqlite3.c ^
             /link /DLL /LIBPATH:"%OPENSSL_PATH%\lib" libcrypto.lib libssl.lib ^
             /OUT:sqlcipher.dll

          if not exist "sqlcipher.dll" (
            echo ERRO: Falha ao gerar sqlcipher.dll
            exit /b 1
          ) else (
            echo sqlcipher.dll compilada com sucesso.
          )

          rem === Compila o executavel (CLI) ===
          echo Compilando executavel de linha de comando (sqlcipher.exe)...
          cl /O2 /DSQLITE_HAS_CODEC /DSQLCIPHER_CRYPTO_OPENSSL /DSQLITE_TEMP_STORE=2 ^
             /I. /I"%OPENSSL_PATH%\include" shell.c sqlite3.c ^
             /link /LIBPATH:"%OPENSSL_PATH%\lib" libcrypto.lib libssl.lib ^
             /OUT:sqlcipher.exe

          if not exist "sqlcipher.exe" (
            echo Aviso: sqlcipher.exe nao foi gerado.
          ) else (
            echo sqlcipher.exe compilado com sucesso.
          )

      - name: Verificar resultados
        shell: powershell
        run: |
          $dll = "sqlcipher\sqlcipher.dll"
          $exe = "sqlcipher\sqlcipher.exe"
          if ((Test-Path $dll) -and (Test-Path $exe)) {
            Write-Host "Build finalizado com sucesso! DLL e EXE disponiveis."
          } elseif (Test-Path $dll) {
            Write-Host "Build parcial: apenas DLL disponivel (sqlcipher.dll)."
          } else {
            Write-Error "Falha: Nenhum artefato encontrado."
            exit 1
          }

      - name: Publicar artefatos compilados
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: |
            sqlcipher/sqlcipher.dll
            sqlcipher/sqlcipher.exe
