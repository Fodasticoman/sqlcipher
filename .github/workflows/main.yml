name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            pkg-config
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - name: Detectar última versão com amalgamados disponíveis
        id: detect-version
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Buscando versão mais recente do SQLCipher com arquivos amalgamados..."

          TAGS=("v4.6.0" "v4.5.6" "v4.5.5" "v4.5.4" "v4.5.3" "v4.5.2" "v4.5.1" "v4.5.0")

          for TAG in "${TAGS[@]}"; do
            BASE_URL="https://raw.githubusercontent.com/sqlcipher/sqlcipher/${TAG}"
            TEST_URL="$BASE_URL/sqlite3.c"
            if curl --head --silent --fail "$TEST_URL" >/dev/null; then
              echo "✅ Versão compatível encontrada: $TAG"
              echo "version=$TAG" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "⚠️ Nenhuma versão recente encontrada, usando fallback v4.5.0."
          echo "version=v4.5.0" >> $GITHUB_OUTPUT

      - name: Baixar e extrair SQLCipher
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.detect-version.outputs.version }}"
          echo "📦 Baixando SQLCipher versão $TAG..."

          curl -L --retry 5 --retry-delay 3 --fail \
            "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/${TAG}.tar.gz" \
            -o sqlcipher.tar.gz

          echo "📦 Extraindo com 7-Zip..."
          mkdir extract && cd extract
          7z x ../sqlcipher.tar.gz -y >/dev/null
          7z x sqlcipher.tar -y >/dev/null
          rm sqlcipher.tar

          EXTRACTED_DIR=$(ls -d sqlcipher-* | head -n 1)
          mv "$EXTRACTED_DIR" ../sqlcipher
          cd ..
          echo "✅ SQLCipher $TAG pronto para compilação."

      - name: Baixar amalgamados oficiais
        shell: bash
        run: |
          set -euo pipefail
          cd sqlcipher
          TAG="${{ steps.detect-version.outputs.version }}"
          echo "📥 Baixando arquivos amalgamados oficiais da versão $TAG..."

          BASE_URL="https://raw.githubusercontent.com/sqlcipher/sqlcipher/${TAG}"
          FILES=("sqlite3.c" "sqlite3.h" "src/shell.c")
          for FILE in "${FILES[@]}"; do
            URL="$BASE_URL/$FILE"
            if curl --head --silent --fail "$URL" >/dev/null; then
              echo "⬇️  Baixando $FILE..."
              curl -L --fail -o "$(basename $FILE)" "$URL"
            else
              echo "⚠️  Arquivo $FILE não encontrado em $URL"
              exit 1
            fi
          done

          echo "✅ Arquivos amalgamados prontos:"
          ls -lh sqlite3.c sqlite3.h shell.c

      - name: Compilar SQLCipher com OpenSSL
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd sqlcipher

          echo "⚙️ Compilando SQLCipher..."
          gcc -O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
            -I. -shared -o libsqlcipher.dll sqlite3.c \
            -lcrypto -lssl -lz

          echo "⚙️ Compilando shell (CLI)..."
          gcc -O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
            -I. -o sqlcipher.exe shell.c sqlite3.c \
            -lcrypto -lssl -lz

          echo "✅ Compilação concluída:"
          ls -lh sqlcipher.exe libsqlcipher.dll || true

      - name: Organizar artefatos
        shell: bash
        run: |
          mkdir -p build-output
          cp sqlcipher/sqlcipher.exe build-output/sqlcipher.exe || true
          cp sqlcipher/libsqlcipher.dll build-output/libsqlcipher.dll || true
          echo "✅ Artefatos copiados:"
          ls -lh build-output

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/
