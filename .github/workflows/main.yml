set -euo pipefail

echo "📁 Criando diretórios..."
mkdir -p build_sqlcipher
cd build_sqlcipher

echo "⬇️ Clonando SQLCipher..."
git clone --depth 1 https://github.com/sqlcipher/sqlcipher.git
cd sqlcipher

echo "🔍 Verificando script configure..."
if [ ! -f configure ]; then
  echo "⚠️ Script configure não encontrado. Gerando com autoreconf..."
  autoreconf -fi
fi

echo "⚙️ Configurando build..."
# Removidas aspas internas e variáveis limpas para evitar erro TCL
export CFLAGS=-O2
export CPPFLAGS=-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2 -I/mingw64/include
export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz"

# Executa configure usando bash POSIX
bash ./configure --enable-shared --enable-static --disable-tcl

echo "🧩 Compilando..."
make -j$(nproc)

echo "✅ Build concluído com sucesso."
mkdir -p ../../output

echo "📦 Copiando artefatos..."
cp -f .libs/libsqlcipher-0.dll ../../output/ || true
cp -f .libs/libsqlcipher.a ../../output/ || true
cp -f sqlcipher.exe ../../output/ || true
cp -f sqlite3.h ../../output/sqlite.h || true
cp -f /mingw64/bin/libssl-3-x64.dll ../../output/ || true
cp -f /mingw64/bin/libcrypto-3-x64.dll ../../output/ || true
cp -f /mingw64/bin/zlib1.dll ../../output/ || true

echo "🗜️ Compactando artefatos..."
cd ../../
7z a sqlcipher-win64.zip ./output/*

echo "✅ Arquivo 'sqlcipher-win64.zip' gerado com sucesso!"
