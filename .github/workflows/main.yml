name: Build SQLCipher for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: 🧹 Limpar diretório antigo (forçado)
      shell: pwsh
      run: |
        $root = "D:\\a\\sqlcipher"
        Write-Host "🧽 Limpando $root..."

        try {
          Get-Process bash, make, sh, git -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        } catch {}

        if (Test-Path $root) {
          Write-Host "🧹 Removendo $root..."
          try {
            Remove-Item -Recurse -Force $root -ErrorAction Stop
          } catch {
            Write-Host "⚠️ Remoção direta falhou, tentando com robocopy..."
            New-Item -ItemType Directory -Path "D:\\a\\empty" -Force | Out-Null
            $rc = Start-Process -FilePath "robocopy" -ArgumentList @("D:\\a\\empty", $root, "/MIR") -Wait -PassThru
            if ($rc.ExitCode -ge 8) { exit 1 }
            Remove-Item -Recurse -Force "D:\\a\\empty" -ErrorAction SilentlyContinue
          }
        }
        Write-Host "✅ Ok! Diretório limpo."

    - name: 🔧 Instalar MSYS2 + Build Deps
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-zlib
          autoconf
          automake
          libtool
          git

    - name: ⬇️ Clonar SQLCipher
      shell: msys2 {0}
      run: |
        set -euo pipefail
        cd /d/a
        git clone https://github.com/sqlcipher/sqlcipher.git
        cd sqlcipher
        git checkout v4.11.0 || git checkout c6e8461bfa0b7317dfd96278dd950b1eb6b21a1a
        echo "✅ Clone OK!"

    - name: 🏗️ Configurar & Compilar SQLCipher
      shell: msys2 {0}
      run: |
        set -euo pipefail
        cd /d/a/sqlcipher

        export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
        -DSQLITE_TEMP_STORE=2 -I/mingw64/include"

        export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz"

        autoreconf -fi
        ./configure --enable-shared --enable-static --disable-tcl
        make -j$(nproc)
        strip sqlcipher.exe || true
        strip .libs/libsqlcipher-0.dll || true

    - name: 📦 Copiar artefatos finais
      shell: pwsh
      run: |
        $dist = "D:\\a\\artifacts"
        New-Item -ItemType Directory -Force -Path $dist | Out-Null
        Copy-Item "D:\\a\\sqlcipher\\sqlcipher.exe" $dist
        Copy-Item "D:\\a\\sqlcipher\\.libs\\libsqlcipher-0.dll" $dist
        Copy-Item "C:\\msys64\\mingw64\\bin\\libcrypto-3-x64.dll" $dist
        Copy-Item "C:\\msys64\\mingw64\\bin\\libssl-3-x64.dll" $dist
        Copy-Item "C:\\msys64\\mingw64\\bin\\zlib1.dll" $dist
        Write-Host "✅ Arquivos copiados para $dist"

    - name: 📤 Publicar artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sqlcipher-windows
        path: D:\a\artifacts
