name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =============================
      # 1. Clonar o repositório
      # =============================
      - name: Checkout repositório
        uses: actions/checkout@v4

      # =============================
      # 2. Instalar MSYS2 e dependências completas
      # =============================
      - name: Configurar ambiente MSYS2 com todas as dependências
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            msys2-runtime
            autoconf
            automake
            libtool
            m4
            make
            pkg-config
            tcl
            git
            tar
            gzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-tcl

      # =============================
      # 3. Baixar o código-fonte do SQLCipher
      # =============================
      - name: Baixar SQLCipher
        shell: bash
        run: |
          set -euo pipefail
          TAG="v4.5.5"
          echo "Baixando SQLCipher versão $TAG..."
          curl -L "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/${TAG}.tar.gz" -o sqlcipher.tar.gz
          tar -xzf sqlcipher.tar.gz
          mv sqlcipher-* sqlcipher
          cd sqlcipher
          echo "✅ SQLCipher extraído."

      # =============================
      # 4. Gerar arquivos amalgamados (sqlite3.c e shell.c)
      # =============================
      - name: Gerar arquivos amalgamados com Tcl
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd sqlcipher
          echo "🔧 Gerando sqlite3.c e shell.c..."
          if [ ! -f sqlite3.c ]; then
            /usr/bin/tclsh tool/mksqlite3c.tcl --linemacros=0 > sqlite3.c
          fi
          if [ ! -f shell.c ]; then
            /usr/bin/tclsh tool/mkshellc.tcl > shell.c
          fi
          ls -lh sqlite3.c shell.c

      # =============================
      # 5. Configurar e compilar SQLCipher (gerando DLL + EXE)
      # =============================
      - name: Compilar SQLCipher com suporte a OpenSSL
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd sqlcipher

          echo "🔧 Executando autoreconf..."
          autoreconf -fi

          echo "⚙️ Executando ./configure..."
          ./configure \
            --enable-tempstore=yes \
            --enable-fts5 \
            --enable-json1 \
            --disable-tcl \
            --with-crypto-lib=openssl \
            CFLAGS="-O2 -DSQLITE_HAS_CODEC" \
            LDFLAGS="-lcrypto -lssl"

          echo "🧱 Compilando..."
          make -j$(nproc)

          echo "✅ Compilação finalizada. Listando binários:"
          ls -lh .libs/ || true
          ls -lh *.dll || true
          ls -lh *.exe || true

      # =============================
      # 6. Copiar artefatos finais (DLL e EXE)
      # =============================
      - name: Organizar artefatos
        shell: bash
        run: |
          mkdir -p build-output
          cp sqlcipher/.libs/libsqlcipher*.dll build-output/sqlcipher.dll || true
          cp sqlcipher/sqlite3.exe build-output/sqlcipher.exe || true
          echo "✅ Artefatos copiados:"
          ls -lh build-output

      # =============================
      # 7. Publicar artefatos compilados
      # =============================
      - name: Publicar artefatos compilados
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/
