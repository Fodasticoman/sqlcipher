name: Build SQLCipher v4.11.0 (Windows + OpenSSL + Zlib)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 🧹 Instalar MSYS2
      - name: 🧹 Instalar MSYS2
        run: |
          choco install -y msys2
          echo "✅ MSYS2 instalado com sucesso."

      # ⚙️ Atualizar pacotes e instalar dependências
      - name: ⚙️ Atualizar pacotes e instalar dependências
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          set -e
          pacman -Syu --noconfirm
          pacman -S --noconfirm git make automake libtool autoconf \
            mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-zlib mingw-w64-x86_64-tcl zip
          echo "✅ Dependências instaladas."

      # 🧬 Clonar SQLCipher v4.11.0
      - name: 🧬 Clonar SQLCipher (v4.11.0)
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          set -e
          cd /d/a/
          git clone https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher
          git checkout v4.11.0 || git checkout c6e8461bfa0b7317dfd96278dd950b1eb6b21a1a
          echo "✅ SQLCipher v4.11.0 clonado."

      # 🏗️ Gerar configure e compilar SQLCipher
      - name: 🏗️ Configurar e compilar SQLCipher
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          set -e
          cd /d/a/sqlcipher/sqlcipher

          echo "🧰 Gerando script configure..."
          autoreconf -fi

          echo "⚙️ Executando configure..."
          ./configure --enable-tempstore=yes \
            CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2" \
            LDFLAGS="-lcrypto -lssl -lz" \
            --disable-tcl

          echo "🧩 Compilando..."
          make -j$(nproc)

          echo "✅ Compilação concluída com sucesso."
          ls -lh . || true

      # 📦 Copiar binários e dependências
      - name: 📦 Copiar binários e dependências
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          set -e
          cd /d/a/sqlcipher/sqlcipher

          mkdir -p /d/a/sqlcipher/dist

          # Copiar binários principais
          cp sqlcipher.exe /d/a/sqlcipher/dist/ 2>/dev/null || cp sqlite3.exe /d/a/sqlcipher/dist/sqlcipher.exe
          cp .libs/libsqlcipher-0.dll /d/a/sqlcipher/dist/ 2>/dev/null || true
          cp sqlcipher.h /d/a/sqlcipher/dist/ || cp sqlite3.h /d/a/sqlcipher/dist/sqlcipher.h
          cp sqlcipherext.h /d/a/sqlcipher/dist/ || cp sqlite3ext.h /d/a/sqlcipher/dist/sqlcipherext.h

          # Copiar dependências essenciais
          cp /mingw64/bin/libcrypto-3-x64.dll /d/a/sqlcipher/dist/ || true
          cp /mingw64/bin/libssl-3-x64.dll /d/a/sqlcipher/dist/ || true
          cp /mingw64/bin/zlib1.dll /d/a/sqlcipher/dist/ || true

          echo "✅ Todos os binários e DLLs copiados para /d/a/sqlcipher/dist"

      # 🧪 Testar execução básica (versão e inicialização)
      - name: 🧪 Testar binário SQLCipher
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          set -e
          cd /d/a/sqlcipher/dist
          ./sqlcipher -version || ./sqlcipher --version || echo "⚠️ Não foi possível exibir versão."

          # Teste funcional simples: cria e lê um banco criptografado
          echo "PRAGMA key='test123'; CREATE TABLE demo(x); INSERT INTO demo VALUES(42); SELECT * FROM demo;" | ./sqlcipher test.db

      # 🗜️ Compactar resultado final
      - name: 🗜️ Compactar resultado final
        run: |
          $distPath = "D:/a/sqlcipher/dist"
          if (-Not (Test-Path $distPath)) {
            Write-Error "❌ Diretório $distPath não encontrado!"
            exit 1
          }
          Compress-Archive -Path "$distPath/*" -DestinationPath "D:/a/sqlcipher/sqlcipher-4.11.0-win64.zip" -Force
          echo "✅ Arquivo ZIP final criado com sucesso."

      # 📤 Publicar artefato final único
      - name: 📤 Publicar artefato final
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-4.11.0-win64
          path: D:/a/sqlcipher/sqlcipher-4.11.0-win64.zip
