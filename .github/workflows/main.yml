name: Build SQLCipher for Windows (MSYS2)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            autoconf
            automake
            libtool
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-7zip

      - name: 🏗️ Build SQLCipher
        shell: msys2 {0}
        run: |
          set -euo pipefail
          
          echo "📁 Criando diretórios..."
          mkdir -p build_sqlcipher
          cd build_sqlcipher
          
          echo "⬇️ Clonando SQLCipher..."
          git clone --depth 1 https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher
          
          echo "🔍 Preparando script configure..."
          autoreconf -fi || true

          echo "⚙️ Configurando build..."
          export CFLAGS="-O2 -D_FILE_OFFSET_BITS=64"
          export CPPFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2 -D_WIN32_WINNT=0x0601 -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz -static-libgcc -static-libstdc++"

          ./configure --enable-shared --enable-static --disable-tcl || (cat config.log && false)

          echo "🧩 Compilando..."
          make -j$(nproc)

          echo "✅ Build concluído com sucesso."
          mkdir -p ../../output

          echo "📦 Copiando artefatos..."
          cp -f .libs/libsqlcipher-0.dll ../../output/ || true
          cp -f .libs/libsqlcipher.a ../../output/ || true
          cp -f sqlcipher.exe ../../output/ || true
          cp -f sqlite3.h ../../output/sqlite.h || true
          cp -f /mingw64/bin/libssl-3-x64.dll ../../output/ || true
          cp -f /mingw64/bin/libcrypto-3-x64.dll ../../output/ || true
          cp -f /mingw64/bin/zlib1.dll ../../output/ || true

          echo "🗜️ Compactando artefatos..."
          cd ../../
          7z a sqlcipher-win64.zip ./output/*

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-win64
          path: sqlcipher-win64.zip
