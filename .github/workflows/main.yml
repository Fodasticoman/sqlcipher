name: Build SQLCipher with OpenSSL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧰 Iniciar job
        run: echo "🚀 Iniciando build do SQLCipher (com OpenSSL no Windows)..."

      - name: 📦 Checkout repositório
        uses: actions/checkout@v4

      - name: ⚙️ Instalar dependências básicas
        shell: pwsh
        run: |
          choco install -y openssl
          choco install -y msys2
          echo "✅ OpenSSL e MSYS2 instalados."

      - name: 🧩 Configurar MSYS2 e pacotes nativos
        shell: bash
        run: |
          echo "🔧 Atualizando pacotes..."
          export PATH="/c/msys64/usr/bin:/c/msys64/mingw64/bin:$PATH"
          pacman -Sy --noconfirm
          pacman -S --noconfirm make gcc pkg-config openssl-devel tcl tcl-devel autoconf automake libtool
          echo "✅ MSYS2 configurado."

      - name: 📥 Baixar e extrair SQLCipher
        shell: bash
        run: |
          echo "📦 Baixando SQLCipher v4.5.5..."
          curl -L -o sqlcipher.tar.gz https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.5.5.tar.gz
          tar -xzf sqlcipher.tar.gz
          mv sqlcipher-4.5.5 sqlcipher

      - name: 🧱 Configurar build (com OpenSSL)
        shell: bash
        working-directory: sqlcipher
        run: |
          echo "🛠️ Executando autoconf..."
          ./configure --enable-tempstore=yes \
                      --with-crypto-lib=openssl \
                      CFLAGS="-DSQLITE_HAS_CODEC" \
                      LDFLAGS="-lcrypto"
          echo "✅ Configuração concluída."

      - name: ⚙️ Compilar SQLCipher
        shell: bash
        working-directory: sqlcipher
        run: |
          echo "🔧 Compilando..."
          make -j4
          echo "✅ Compilação completa."

      - name: 📂 Organizar artefatos
        shell: bash
        run: |
          mkdir -p build-output
          find sqlcipher -type f \( -iname "*.exe" -o -iname "*.dll" -o -iname "sqlcipher" -o -iname "*.so" \) -exec cp {} build-output/ \;
          ls -lh build-output

      - name: 📤 Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/

      - name: ✅ Finalizar job
        run: echo "🏁 Build finalizado com sucesso. Artefatos publicados!"
