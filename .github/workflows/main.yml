# .github/workflows/main.yml
name: Build SQLCipher v4.11.0 (Windows, MSYS2/MINGW64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >
            base-devel
            git
            autoconf
            automake
            libtool
            make
            mingw-w64-x86_64-make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-tcl
            mingw-w64-x86_64-pkg-config
            tar
            gzip

      - name: Verify MSYS2 toolchain
        shell: msys2 {0}
        run: |
          echo "MSYSTEM=$MSYSTEM"
          echo "PATH=$PATH"
          which gcc
          which make
          which tclsh
          gcc --version
          make --version
          tclsh <<< 'puts [info patchlevel]'

      - name: Build SQLCipher v4.11.0
        shell: msys2 {0}
        env:
          TAG: v4.11.0
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig
        run: |
          set -euo pipefail
          echo "🧩 Clonando SQLCipher $TAG..."
          rm -rf sqlcipher || true
          git clone --depth=1 --branch "$TAG" https://github.com/sqlcipher/sqlcipher.git sqlcipher
          cd sqlcipher

          echo "🏗️ Configurando build..."
          export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL \
            -DSQLITE_EXTRA_INIT=sqlcipher_extra_init \
            -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz"
          export PATH="/mingw64/bin:$PATH"

          ./configure --prefix=$(pwd)/build/install \
            --enable-shared --enable-static --disable-tcl \
            CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"

          echo "⚙️ Compilando..."
          make -j$(nproc)
          make install

          echo "📦 Coletando artefatos..."
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cp build/install/bin/*.exe "$GITHUB_WORKSPACE/build-output/" || true
          cp build/install/lib/*.dll "$GITHUB_WORKSPACE/build-output/" || true

          echo "✅ Arquivos finais:"
          ls -la "$GITHUB_WORKSPACE/build-output"

      - name: Upload SQLCipher artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-v4.11.0-windows
          path: build-output/**
