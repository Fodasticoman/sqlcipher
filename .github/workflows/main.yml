name: Build SQLCipher (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧩 Checkout repositório
        uses: actions/checkout@v4

      - name: 🧰 Instalar dependências MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - name: ⚙️ Compilar SQLCipher (modo direto)
        shell: msys2 {0}
        env:
          TAG: v4.10.0
        run: |
          set -euo pipefail
          echo "🔹 Clonando SQLCipher tag: $TAG"

          git clone https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher
          git checkout "$TAG"

          echo "🔹 Definindo flags de compilação..."
          export CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_THREADSAFE=1 -DSQLITE_TEMP_STORE=2 -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz -lws2_32 -lgdi32 -lcrypt32"

          echo "🔹 Compilando sqlcipher (modo Makefile)..."
          make clean || true
          make -j"$(nproc)" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            TCC="x86_64-w64-mingw32-gcc" \
            USE_AMALGAMATION=1 \
            SQLITE_HAS_CODEC=1 \
            SQLITE_TEMP_STORE=2 \
            || { echo '❌ Erro ao compilar SQLCipher'; exit 1; }

          echo "🔹 Copiando binário final..."
          mkdir -p ../build-output
          cp sqlite3 ../build-output/sqlcipher.exe || cp sqlcipher ../build-output/sqlcipher.exe || echo "⚠️ Nenhum binário padrão encontrado."

          echo "✅ Build finalizado! Binário pronto em: build-output/sqlcipher.exe"

      - name: 📦 Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: build-output/sqlcipher.exe
