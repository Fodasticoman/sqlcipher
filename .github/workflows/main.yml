name: Build SQLCipher (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar SQLCipher com MSVC + OpenSSL
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Instalar ferramentas necessárias
      - name: Instalar dependências
        run: |
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --quiet --norestart" -y
          choco install openssl.light -y
        shell: powershell

      # 3️⃣ Baixar SQLCipher diretamente (sem subpasta duplicada)
      - name: Baixar SQLCipher
        run: |
          $tag = "v4.10.0"
          echo 'Baixando SQLCipher versão' $tag '...'
          Invoke-WebRequest -Uri "https://github.com/sqlcipher/sqlcipher/archive/refs/tags/$tag.zip" -OutFile "sqlcipher.zip"
          Expand-Archive sqlcipher.zip -DestinationPath .
          Move-Item "sqlcipher-$tag" "sqlcipher"
          echo 'SQLCipher extraído com sucesso.'
        shell: powershell

      # 4️⃣ Compilar SQLCipher com MSVC + OpenSSL
      - name: Compilar SQLCipher
        shell: cmd
        run: |
          echo Iniciando ambiente de compilação...
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"

          cd sqlcipher
          echo Compilando SQLCipher com suporte a OpenSSL...

          set "OPENSSL_PATH=C:\Program Files\OpenSSL"

          rem Compilação correta (arquivos dentro de src\)
          cl /O2 /DSQLITE_HAS_CODEC /DSQLCIPHER_CRYPTO_OPENSSL /DSQLITE_TEMP_STORE=2 ^
             /I. /I"src" /I"%OPENSSL_PATH%\include" src\shell.c src\sqlite3.c ^
             /link /LIBPATH:"%OPENSSL_PATH%\lib" libcrypto.lib libssl.lib ^
             /OUT:sqlcipher.exe

          if exist sqlcipher.exe (
            echo Compilação concluída com sucesso!
          ) else (
            echo ERRO: sqlcipher.exe não foi gerado!
            echo Diretório atual:
            cd
            echo Conteúdo:
            dir
            exit /b 1
          )

      # 5️⃣ Upload do artefato final
      - name: Upload do binário
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows
          path: sqlcipher/sqlcipher.exe
