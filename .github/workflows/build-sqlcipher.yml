name: Build SQLCipher (Release with DLL for Unity)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧰 Configurar MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            git
            autoconf
            automake
            libtool
            make
            7zip

      - name: 🧱 Compilar SQLCipher (Release)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MSYS_NO_PATHCONV=1

          echo "📁 Criando diretórios..."
          mkdir -p build_sqlcipher
          cd build_sqlcipher

          echo "⬇️ Clonando SQLCipher..."
          git clone --depth 1 https://github.com/sqlcipher/sqlcipher.git
          cd sqlcipher

          echo "🔧 Preparando configuração..."
          autoreconf -fi || true

          echo "⚙️ Configurando build (modo Release)..."
          export CFLAGS="-O3 -DNDEBUG -D_FILE_OFFSET_BITS=64"
          export CPPFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2 -D_WIN32_WINNT=0x0601 -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz -static-libgcc -static-libstdc++"

          ./configure --enable-shared --enable-static --disable-tcl --disable-load-extension

          echo "🧩 Compilando..."
          make -j$(nproc)

          echo "✅ Build concluído. Preparando artefatos..."
          mkdir -p ../../output

          # Copiar DLL principal
          if [ -f .libs/libsqlite3-0.dll ]; then
            cp -f .libs/libsqlite3-0.dll ../../output/libsqlcipher-0.dll
          elif [ -f .libs/libsqlcipher-0.dll ]; then
            cp -f .libs/libsqlcipher-0.dll ../../output/libsqlcipher-0.dll
          elif [ -f .libs/sqlite3.dll ]; then
            cp -f .libs/sqlite3.dll ../../output/libsqlcipher-0.dll
          else
            echo "❌ ERRO: Nenhum arquivo DLL encontrado!"
            ls -al .libs || true
            exit 1
          fi

          # Copiar binários e headers
          cp -f sqlite3.exe ../../output/sqlcipher.exe || true
          cp -f sqlite3.h ../../output/sqlite.h || true
          cp -f .libs/libsqlite3.a ../../output/libsqlcipher.a || true

          # Dependências
          cp -f /mingw64/bin/libssl-3-x64.dll ../../output/ || true
          cp -f /mingw64/bin/libcrypto-3-x64.dll ../../output/ || true
          cp -f /mingw64/bin/zlib1.dll ../../output/ || true

          echo "🧹 Limpando símbolos e otimizando..."
          strip ../../output/*.dll || true
          strip ../../output/sqlcipher.exe || true

          echo "🗜️ Compactando artefatos..."
          cd ../../
          7z a sqlcipher-win64.zip ./output/*

      - name: 📦 Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-win64
          path: sqlcipher-win64.zip
