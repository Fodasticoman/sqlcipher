name: Build SQLCipher (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧰 Configurando MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            wget
            zip
            p7zip

      - name: 🧱 Compilando SQLCipher
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MSYS_NO_PATHCONV=1

          echo "📁 Criando diretórios..."
          mkdir -p build_sqlcipher
          cd build_sqlcipher

          echo "⬇️ Baixando release SQLCipher..."
          wget -q https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.11.0.tar.gz -O sqlcipher.tar.gz
          tar -xzf sqlcipher.tar.gz
          cd sqlcipher-4.11.0

          echo "⚙️ Configurando build..."
          export CFLAGS="-O2 -D_FILE_OFFSET_BITS=64"
          export CPPFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2 -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -D_WIN32_WINNT=0x0601 -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -lssl -lcrypto -lz -static-libgcc -static-libstdc++"

          ./configure --enable-shared --enable-static --disable-tcl --disable-load-extension

          echo "🧱 Compilando..."
          make -j$(nproc)

          echo "✅ Build concluído com sucesso."
          mkdir -p ../../output

          echo "📦 Copiando artefatos..."
          if [ -f .libs/libsqlcipher-0.dll ]; then
            cp -f .libs/libsqlcipher-0.dll ../../output/
          elif [ -f .libs/libsqlite3-0.dll ]; then
            cp -f .libs/libsqlite3-0.dll ../../output/libsqlcipher-0.dll
          fi

          cp -f .libs/libsqlcipher.a ../../output/ || true
          cp -f sqlcipher.exe ../../output/ || cp -f sqlite3.exe ../../output/sqlcipher.exe || true
          cp -f sqlite3.h ../../output/sqlite.h || true
          cp -f /mingw64/bin/libssl-3-x64.dll ../../output/ || true
          cp -f /mingw64/bin/libcrypto-3-x64.dll ../../output/ || true
          cp -f /mingw64/bin/zlib1.dll ../../output/ || true

          echo "🗜️ Compactando artefatos..."
          cd ../../
          7z a sqlcipher-win64.zip ./output/*

      - name: 📤 Enviando artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-win64
          path: sqlcipher-win64.zip
